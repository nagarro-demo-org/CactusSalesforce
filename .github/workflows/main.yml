name: Salesforce Delta Deployment

on:
  pull_request:
    branches: [ci, qa, uat, main]
  push:
    branches: [ci, qa, uat, main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # -----------------------------------------
  # STEP 1: Determine Environment
  # -----------------------------------------
  setup:
    runs-on: ubuntu-latest
    outputs:
      env_name: ${{ steps.env.outputs.env_name }}

    steps:
      - name: Set target environment
        id: env
        run: |
          if [[ "${{ github.base_ref }}" == "ci" || "${{ github.ref_name }}" == "ci" ]]; then
            echo "env_name=CI" >> $GITHUB_OUTPUT
          elif [[ "${{ github.base_ref }}" == "qa" || "${{ github.ref_name }}" == "qa" ]]; then
            echo "env_name=QA" >> $GITHUB_OUTPUT
          elif [[ "${{ github.base_ref }}" == "uat" || "${{ github.ref_name }}" == "uat" ]]; then
            echo "env_name=UAT" >> $GITHUB_OUTPUT
          else
            echo "env_name=PROD" >> $GITHUB_OUTPUT
          fi

  # -----------------------------------------
  # STEP 2: Validate / Deploy
  # -----------------------------------------
  validate-or-deploy:
    runs-on: ubuntu-latest
    needs: setup

    # ✅ IMPORTANT: attach environment here
    environment:
      name: ${{ needs.setup.outputs.env_name }}

    steps:
      # -----------------------------------------
      # Checkout & Setup
      # -----------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Salesforce CLI
        run: |
          npm install -g @salesforce/cli
          sf version

      - name: Install sfdx-git-delta
        run: |
          echo y | sf plugins install sfdx-git-delta
          sfdx plugins | grep sfdx-git-delta

      # -----------------------------------------
      # Authenticate (JWT)
      # -----------------------------------------
      - name: Authenticate to Salesforce (JWT)
        run: |
          echo "${{ secrets.SF_JWT_KEY }}" > server.key

          sf org login jwt \
            --client-id ${{ secrets.SF_CONSUMER_KEY }} \
            --jwt-key-file server.key \
            --username ${{ secrets.SF_USERNAME }} \
            --alias targetOrg \
            --instance-url ${{ secrets.SF_INSTANCE_URL }}

      # -----------------------------------------
      # Generate Delta
      # -----------------------------------------
      - name: Generate Delta
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            FROM=${{ github.event.pull_request.base.sha }}
            TO=${{ github.event.pull_request.head.sha }}
          else
            FROM=${{ github.event.before }}
            TO=${{ github.sha }}
          fi

          sf sgd source delta \
            --to $TO \
            --from $FROM \
            --output-dir delta \
            --generate-delta

      # -----------------------------------------
      # VALIDATION (PR)
      # -----------------------------------------
      - name: Validate Deployment (PR)
        if: github.event_name == 'pull_request'
        run: |
          sf project deploy start \
            --source-dir delta/force-app \
            --target-org targetOrg \
            --test-level RunLocalTests \
            --dry-run \
            --wait 30

      # -----------------------------------------
      # DEPLOYMENT (Push)
      # -----------------------------------------
      - name: Deploy (Push)
        if: github.event_name == 'push'
        run: |
          sf project deploy start \
            --source-dir delta/force-app \
            --target-org targetOrg \
            --test-level RunLocalTests \
            --wait 30