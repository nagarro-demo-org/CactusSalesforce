name: Salesforce Delta Deployment
run-name: "Run on $${{ github.event_name }} in ${{ github.event.pull_request.base.ref || github.ref_name }} ENV by @${{ github.actor }}"


on:
  pull_request:
    branches: [ci, qa, uat, main]
    paths:
      - 'force-app/**'
      - 'manifest/**'
      - '.github/workflows/main.yml'

  pull_request_review:
    types: [submitted]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # -----------------------------------------
  # STEP 1: Determine Environment
  # -----------------------------------------
  setup:
    runs-on: ubuntu-latest
    outputs:
      env_name: ${{ steps.env.outputs.env_name }}

    steps:
      - name: Set target environment
        id: env
        run: |
          if [[ "${{ github.event_name }}" == "pull_request_review" ]]; then
            TARGET="${{ github.event.pull_request.base.ref }}"
          else
            TARGET="${{ github.base_ref || github.ref_name }}"
          fi

          if [[ "$TARGET" == "ci" ]]; then
            echo "env_name=CI" >> $GITHUB_OUTPUT
          elif [[ "$TARGET" == "qa" ]]; then
            echo "env_name=QA" >> $GITHUB_OUTPUT
          elif [[ "$TARGET" == "uat" ]]; then
            echo "env_name=UAT" >> $GITHUB_OUTPUT
          elif [[ "$TARGET" == "main" ]]; then
            echo "env_name=PROD" >> $GITHUB_OUTPUT
          fi

  # -----------------------------------------
  # STEP 2: Validate / Deploy
  # -----------------------------------------
  validate-or-deploy:
    runs-on: ubuntu-latest
    needs: setup
    permissions:
      contents: write
      pull-requests: write

    # ✅ IMPORTANT: attach environment here
    environment:
      name: ${{ needs.setup.outputs.env_name }}

    steps:
      # -----------------------------------------
      # Checkout & Setup
      # -----------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Salesforce CLI
        run: |
          npm install -g @salesforce/cli
          sf version

      - name: Install sfdx-git-delta
        run: |
          echo y | sf plugins install sfdx-git-delta
          sfdx plugins | grep sfdx-git-delta

      # -----------------------------------------
      # Authenticate (JWT)
      # -----------------------------------------
      - name: Authenticate to Salesforce (JWT)
        run: |
          echo "${{ secrets.SF_JWT_KEY }}" > server.key

          sf org login jwt \
            --client-id ${{ secrets.SF_CONSUMER_KEY }} \
            --jwt-key-file server.key \
            --username ${{ secrets.SF_USERNAME }} \
            --alias targetOrg \
            --instance-url ${{ secrets.SF_INSTANCE_URL }}

      # -----------------------------------------
      # Generate Delta
      # -----------------------------------------
      - name: Generate Delta
        run: |
          mkdir -p delta
          if [[ "${{ github.event_name }}" == "push" ]]; then
            FROM=${{ github.event.before }}
            TO=${{ github.sha }}
          else
            # Covers pull_request + pull_request_review
            FROM=${{ github.event.pull_request.base.sha }}
            TO=${{ github.event.pull_request.head.sha }}            
          fi

          sf sgd source delta \
            --to $TO \
            --from $FROM \
            --output-dir delta \
            --repo-dir . \
            --generate-delta \
            --api-version 66.0

          echo "──── package.xml ────"
          cat delta/package/package.xml || echo "(empty)"
          echo "──── destructiveChanges.xml ────"
          cat delta/destructiveChanges/destructiveChanges.xml 2>/dev/null || echo "(none)"
      
      # -----------------------------------------
      # VALIDATION (PR)
      # -----------------------------------------
      - name: Validate Deployment (PR)
        if: github.event_name == 'pull_request'
        run: |
          sf project deploy validate \
            --manifest delta/package/package.xml \
            --post-destructive-changes delta/destructiveChanges/destructiveChanges.xml \
            --target-org targetOrg \
            --test-level RunRelevantTests \
            --wait 30

      # -----------------------------------------
      # DEPLOYMENT (Approved Review)
      # -----------------------------------------
      - name: Deploy (PR Approved)
        if: github.event_name == 'pull_request_review' && github.event.review.state == 'approved'
        run: |
          sf project deploy start \
            --manifest delta/package/package.xml \
            --post-destructive-changes delta/destructiveChanges/destructiveChanges.xml \
            --target-org targetOrg \
            --test-level RunRelevantTests \
            --wait 30

      # -----------------------------------------
      # AUTO MERGE (on successful deployment)
      # -----------------------------------------
      - name: Auto Merge on Successful Deployment
        if: github.event_name == 'pull_request_review' && github.event.review.state == 'approved' && success()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            if (!pr) {
              core.warning('No PR found in context');
              return;
            }
            
            try {
              await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                merge_method: 'squash'
              });
              core.info(`✅ Pull request #${pr.number} merged successfully`);
            } catch (error) {
              core.error(`❌ Failed to merge PR: ${error.message}`);
              throw error;
            }