name: Salesforce Delta Deployment

run-name: "Run on ${{ github.event_name }} in ${{ github.event.pull_request.base.ref || github.ref_name }} by @${{ github.actor }} (PR #${{ github.event.pull_request.number || 'N/A' }})"

on:
  pull_request:
    branches: [ci, qa, uat, main]
    paths:
      - 'force-app/**'
      - 'manifest/**'
      - '.github/workflows/main.yml'

  pull_request_review:
    types: [submitted]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  pull-requests: write

# -----------------------------------------
# 1. SETUP
# -----------------------------------------
jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      env_name: ${{ steps.env.outputs.env_name }}

    steps:
      - name: Set target environment
        id: env
        run: |
          if [[ "${{ github.event_name }}" == "pull_request_review" ]]; then
            TARGET="${{ github.event.pull_request.base.ref }}"
          else
            TARGET="${{ github.base_ref || github.ref_name }}"
          fi

          if [[ "$TARGET" == "ci" ]]; then
            echo "env_name=CI" >> $GITHUB_OUTPUT
          elif [[ "$TARGET" == "qa" ]]; then
            echo "env_name=QA" >> $GITHUB_OUTPUT
          elif [[ "$TARGET" == "uat" ]]; then
            echo "env_name=UAT" >> $GITHUB_OUTPUT
          elif [[ "$TARGET" == "main" ]]; then
            echo "env_name=PROD" >> $GITHUB_OUTPUT
          fi

# -----------------------------------------
# 2. BUILD (Generate Delta)
# -----------------------------------------
  build:
    runs-on: ubuntu-latest
    needs: setup

    environment:
      name: ${{ needs.setup.outputs.env_name }}

    outputs:
      has_delta: ${{ steps.check.outputs.has_delta }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install CLI & Plugins
        run: |
          npm install -g @salesforce/cli
          sf version
          echo y | sf plugins install sfdx-git-delta
          sfdx plugins | grep sfdx-git-delta

      - name: Generate Delta
        id: delta
        run: |
          mkdir -p delta

          if [[ "${{ github.event_name }}" == "push" ]]; then
            FROM=${{ github.event.before }}
            TO=${{ github.sha }}
          else
            FROM=${{ github.event.pull_request.base.sha }}
            TO=${{ github.event.pull_request.head.sha }}
          fi

          sf sgd source delta \
            --to $TO \
            --from $FROM \
            --output-dir delta \
            --repo-dir . \
            --generate-delta

      - name: Check Delta
        id: check
        run: |
          echo "──── package.xml ────"
          cat delta/package/package.xml || echo "(empty)"
          echo "──── destructiveChanges.xml ────"
          cat delta/destructiveChanges/destructiveChanges.xml 2>/dev/null || echo "(none)"

          if ! grep -q "<types>" delta/package/package.xml && ! grep -q "<types>" delta/destructiveChanges/destructiveChanges.xml; then
            echo "has_delta=true" >> $GITHUB_OUTPUT
            echo "Nothing to deploy or delete"
          else
            echo "has_delta=false" >> $GITHUB_OUTPUT
            cp sfdx-project.json delta/
            cp env/.env.${{ needs.setup.outputs.env_name }} delta/.env
          fi

      - name: Upload Delta Artifact
        uses: actions/upload-artifact@v4
        with:
          name: delta
          path: delta
          include-hidden-files: true

# -----------------------------------------
# 3. VALIDATE (PR)
# -----------------------------------------
  validate:
    runs-on: ubuntu-latest
    needs: [setup, build]
    if: github.event_name == 'pull_request' && needs.build.outputs.has_delta != 'true'

    environment:
      name: ${{ needs.setup.outputs.env_name }}

    steps:
      - name: Download Delta
        uses: actions/download-artifact@v4
        with:
          name: delta

      - name: Install CLI
        run: npm install -g @salesforce/cli

      - name: Salesforce Authenticate
        run: |
          echo "${{ secrets.SF_JWT_KEY }}" > server.key
          sf org login jwt \
            --client-id ${{ secrets.SF_CONSUMER_KEY }} \
            --jwt-key-file server.key \
            --username ${{ secrets.SF_USERNAME }} \
            --alias targetOrg \
            --instance-url ${{ secrets.SF_INSTANCE_URL }}

      - name: Validate Delta (PR)
        run: |
          source ./.env
          sf project deploy validate \
            --manifest ./package/package.xml \
            --post-destructive-changes ./destructiveChanges/destructiveChanges.xml \
            --target-org targetOrg \
            --test-level RunRelevantTests \
            --wait 30

# -----------------------------------------
# 4. DEPLOY (On Approval)
# -----------------------------------------
  deploy:
    runs-on: ubuntu-latest
    needs: [setup, build]
    if: github.event_name == 'pull_request_review' && github.event.review.state == 'approved' && needs.build.outputs.has_delta != 'true'

    environment:
      name: ${{ needs.setup.outputs.env_name }}

    steps:
      - name: Download Delta
        uses: actions/download-artifact@v4
        with:
          name: delta

      - name: Install CLI
        run: npm install -g @salesforce/cli

      - name: Salesforce Authenticate
        run: |
          echo "${{ secrets.SF_JWT_KEY }}" > server.key
          sf org login jwt \
            --client-id ${{ secrets.SF_CONSUMER_KEY }} \
            --jwt-key-file server.key \
            --username ${{ secrets.SF_USERNAME }} \
            --alias targetOrg \
            --instance-url ${{ secrets.SF_INSTANCE_URL }}

      - name: Deploy Delta (On Approval)
        run: |
          source ./.env
          sf project deploy start \
            --manifest ./package/package.xml \
            --post-destructive-changes ./destructiveChanges/destructiveChanges.xml \
            --target-org targetOrg \
            --test-level RunRelevantTests \
            --wait 30

# -----------------------------------------
# 5. AUTO MERGE (on successful deployment)
# -----------------------------------------
  auto-merge:
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name == 'pull_request_review' && github.event.review.state == 'approved' && success()

    steps:
      - name: Auto Merge on Successful Deployment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            if (!pr) {
              core.warning('No PR found in context');
              return;
            }
            
            try {
              await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                merge_method: 'squash'
              });
              core.info(`✅ Pull request #${pr.number} merged successfully`);
            } catch (error) {
              core.error(`❌ Failed to merge PR: ${error.message}`);
              throw error;
            }

# -----------------------------------------
# 6. REPORT (Always Runs)
# -----------------------------------------
  report:
    runs-on: ubuntu-latest
    needs: [setup,build, validate, deploy, auto-merge]
    if: always()

    steps:
      - name: Summary
        run: |
          echo "Setup: ${{ needs.setup.result }}"
          echo "Build: ${{ needs.build.result }}"
          echo "Validate: ${{ needs.validate.result }}"
          echo "Deploy: ${{ needs.deploy.result }}"
          echo "Merge: ${{ needs.auto-merge.result }}"